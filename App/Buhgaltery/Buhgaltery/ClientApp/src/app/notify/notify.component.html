<div class="card">
  <div class="card-body">
    <h1 class="card-title">Оставьте отзыв</h1>
    <div *ngIf="showError" class="alert alert-danger" role="alert">
      {{errorMessage}}
    </div>
    <form class="container" [formGroup]="notifyForm" autocomplete="off" novalidate (ngSubmit)="sendMessage(notifyForm.value)">
      <div class="form-group row">
        <label for="message" class="col-form-label col-sm-2">Введите текст отзыва:</label>
        <div class="col-md-5">
          <input type="text" id="message" formControlName="message" class="form-control" />
        </div>
        <div class="col-md-5">
          <em *ngIf="validateControl('message') && hasError('message', 'required')">Message is required</em>
        </div>
      </div>      
      <br>
      <div class="form-group row">
        <div class="col-md-1">
          <button type="submit" class="btn btn-info" [disabled]="!notifyForm.valid">Отправить</button>
        </div>
      </div>
    </form>
  </div>
</div>
